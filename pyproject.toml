[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.mypy_cache
  | \.pytest_cache
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # Erros do pycodestyle
    "W",   # Avisos do pycodestyle
    "F",   # Pyflakes (erros de sintaxe/variáveis não usadas)
    "I",   # Organização de imports (isort)
    "B",   # flake8-bugbear (detecção de bugs comuns)
    "UP",  # pyupgrade (modernização de sintaxe do Python)
]
ignore = [
    "E501", # O Black já gerencia a formatação das linhas de código
]

[tool.ruff.lint.per-file-ignores]
"src/web/app.py" = ["E402"] # Permite imports após sys.path.append()
